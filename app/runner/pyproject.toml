[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "python-ifc-runner"
version = "0.1.0"
description = "Ifc checking engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ifcopenshell>=0.8.3",
    "manifold3d",
    "numpy",
    "python-fcl",
    "pymeshfix",
    "pydantic>=2.11.0",
    "trimesh>=4.0.0",
    "scipy>=1.17.1",
]

[project.scripts]
openbim-runner = "openbim_runner.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.5",
    "pyright>=1.1.400",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openbim_runner"]

[tool.pytest.ini_options]
testpaths = [
    "src/openbim_runner/nodes",
    "tests",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "RUF"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", ".venv", "dist", "**/node_modules", "**/.*"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
